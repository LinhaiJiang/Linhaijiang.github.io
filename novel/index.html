<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>小说创作项目</title>
  <style>
    :root {
      --bg: #fdf6e3;
      --surface: #fff8ee;
      --border: #e0d5b8;
      --accent: #8b4513;
      --accent-light: #c97a3a;
      --text: #3a2a1a;
      --text-muted: #7a6a55;
      --tab-active: #8b4513;
      --danger: #c0392b;
      --sidebar-w: 260px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "PingFang SC", "Microsoft YaHei", "Noto Serif SC", serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    header {
      background: var(--accent);
      color: #fff;
      padding: 0 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      height: 54px;
      flex-shrink: 0;
    }
    header h1 { font-size: 1.2rem; font-weight: 700; flex: 1; }
    #project-title-input {
      background: transparent;
      border: none;
      border-bottom: 1px solid rgba(255,255,255,0.5);
      color: #fff;
      font-size: 1.2rem;
      font-family: inherit;
      font-weight: 700;
      flex: 1;
      outline: none;
    }
    #project-title-input::placeholder { color: rgba(255,255,255,0.6); }
    .header-btn {
      background: rgba(255,255,255,0.2);
      border: 1px solid rgba(255,255,255,0.4);
      color: #fff;
      padding: 4px 14px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.85rem;
      font-family: inherit;
    }
    .header-btn:hover { background: rgba(255,255,255,0.35); }

    /* ── Tabs ── */
    nav.tabs {
      display: flex;
      background: #f5ead0;
      border-bottom: 2px solid var(--border);
      flex-shrink: 0;
      padding: 0 8px;
    }
    .tab {
      padding: 10px 20px;
      cursor: pointer;
      font-size: 0.9rem;
      color: var(--text-muted);
      border-bottom: 2px solid transparent;
      margin-bottom: -2px;
      user-select: none;
      transition: color 0.15s;
    }
    .tab:hover { color: var(--accent); }
    .tab.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }

    /* ── Main layout ── */
    .main { display: flex; flex: 1; overflow: hidden; }

    /* ── Sidebar ── */
    .sidebar {
      width: var(--sidebar-w);
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }
    .sidebar-header {
      padding: 10px 12px;
      background: #f0e6cc;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .sidebar-header span { font-size: 0.85rem; font-weight: 600; color: var(--accent); flex: 1; }
    .btn-sm {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 4px;
      padding: 3px 10px;
      font-size: 0.8rem;
      cursor: pointer;
      font-family: inherit;
    }
    .btn-sm:hover { background: var(--accent-light); }
    .btn-sm.danger { background: var(--danger); }
    .btn-sm.danger:hover { background: #e74c3c; }
    .list { flex: 1; overflow-y: auto; padding: 6px 0; }
    .list-item {
      padding: 8px 14px;
      cursor: pointer;
      font-size: 0.88rem;
      display: flex;
      align-items: center;
      gap: 6px;
      border-left: 3px solid transparent;
      transition: background 0.1s;
    }
    .list-item:hover { background: #f0e8d0; }
    .list-item.active { background: #f0e8d0; border-left-color: var(--accent); font-weight: 600; }
    .list-item .item-label { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .list-item .del-btn {
      visibility: hidden;
      background: none;
      border: none;
      color: var(--danger);
      cursor: pointer;
      font-size: 1rem;
      line-height: 1;
      padding: 0 2px;
    }
    .list-item:hover .del-btn { visibility: visible; }

    /* ── Editor panel ── */
    .editor-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .editor-toolbar {
      padding: 8px 14px;
      background: #faf3e0;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }
    #item-title-input {
      flex: 1;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 5px 10px;
      font-size: 1rem;
      font-family: inherit;
      background: #fff;
      color: var(--text);
      outline: none;
    }
    #item-title-input:focus { border-color: var(--accent); }
    .word-count { font-size: 0.8rem; color: var(--text-muted); white-space: nowrap; }
    textarea#editor {
      flex: 1;
      border: none;
      outline: none;
      padding: 20px 24px;
      font-size: 1rem;
      line-height: 1.9;
      font-family: "PingFang SC", "Microsoft YaHei", "Noto Serif SC", Georgia, serif;
      background: var(--bg);
      color: var(--text);
      resize: none;
    }
    .empty-state {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 12px;
      color: var(--text-muted);
    }
    .empty-state .icon { font-size: 3rem; }
    .empty-state p { font-size: 0.95rem; }

    /* ── Stats panel (overview) ── */
    .overview-panel {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 14px;
    }
    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 18px;
      text-align: center;
    }
    .stat-card .num { font-size: 2rem; font-weight: 700; color: var(--accent); }
    .stat-card .label { font-size: 0.82rem; color: var(--text-muted); margin-top: 4px; }
    .section-title {
      font-size: 1rem;
      font-weight: 700;
      color: var(--accent);
      border-bottom: 1px solid var(--border);
      padding-bottom: 6px;
    }
    .synopsis-area {
      width: 100%;
      min-height: 120px;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px 14px;
      font-size: 0.92rem;
      line-height: 1.8;
      font-family: inherit;
      background: var(--surface);
      color: var(--text);
      outline: none;
      resize: vertical;
    }
    .synopsis-area:focus { border-color: var(--accent); }
    .recent-list { display: flex; flex-direction: column; gap: 6px; }
    .recent-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px 14px;
      font-size: 0.88rem;
      display: flex;
      gap: 10px;
    }
    .recent-item .ri-title { font-weight: 600; min-width: 120px; }
    .recent-item .ri-preview { color: var(--text-muted); flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }

    /* ── Hidden panels ── */
    .panel { display: none; }
    .panel.visible { display: flex; flex-direction: column; flex: 1; overflow: hidden; }
  </style>
</head>
<body>

<header>
  <input id="project-title-input" type="text" placeholder="项目名称…" maxlength="60" />
  <button class="header-btn" onclick="exportProject()">导出</button>
  <button class="header-btn" onclick="clearAll()">清空项目</button>
</header>

<nav class="tabs">
  <div class="tab active" data-tab="overview">📋 概览</div>
  <div class="tab" data-tab="chapters">📖 章节</div>
  <div class="tab" data-tab="characters">👤 人物</div>
  <div class="tab" data-tab="worldbuilding">🌍 世界观</div>
  <div class="tab" data-tab="notes">📝 笔记</div>
</nav>

<div class="main">

  <!-- ───── 概览面板 ───── -->
  <div id="panel-overview" class="panel visible overview-panel">
    <div class="stats-grid" id="stats-grid"></div>
    <div>
      <div class="section-title">故事简介</div>
      <textarea class="synopsis-area" id="synopsis" placeholder="在此填写故事简介、背景设定或创作说明…"></textarea>
    </div>
    <div>
      <div class="section-title">最近编辑</div>
      <div class="recent-list" id="recent-list"></div>
    </div>
  </div>

  <!-- ───── 章节面板 ───── -->
  <div id="panel-chapters" class="panel">
    <div class="sidebar">
      <div class="sidebar-header">
        <span>章节列表</span>
        <button class="btn-sm" onclick="addItem('chapters')">＋ 新增</button>
      </div>
      <div class="list" id="list-chapters"></div>
    </div>
    <div class="editor-panel" id="editor-chapters">
      <div class="empty-state">
        <div class="icon">📖</div>
        <p>点击左侧章节开始编辑，或新增章节</p>
      </div>
    </div>
  </div>

  <!-- ───── 人物面板 ───── -->
  <div id="panel-characters" class="panel">
    <div class="sidebar">
      <div class="sidebar-header">
        <span>人物档案</span>
        <button class="btn-sm" onclick="addItem('characters')">＋ 新增</button>
      </div>
      <div class="list" id="list-characters"></div>
    </div>
    <div class="editor-panel" id="editor-characters">
      <div class="empty-state">
        <div class="icon">👤</div>
        <p>点击左侧人物开始编辑，或新增人物</p>
      </div>
    </div>
  </div>

  <!-- ───── 世界观面板 ───── -->
  <div id="panel-worldbuilding" class="panel">
    <div class="sidebar">
      <div class="sidebar-header">
        <span>世界观设定</span>
        <button class="btn-sm" onclick="addItem('worldbuilding')">＋ 新增</button>
      </div>
      <div class="list" id="list-worldbuilding"></div>
    </div>
    <div class="editor-panel" id="editor-worldbuilding">
      <div class="empty-state">
        <div class="icon">🌍</div>
        <p>点击左侧条目开始编辑，或新增条目</p>
      </div>
    </div>
  </div>

  <!-- ───── 笔记面板 ───── -->
  <div id="panel-notes" class="panel">
    <div class="sidebar">
      <div class="sidebar-header">
        <span>创作笔记</span>
        <button class="btn-sm" onclick="addItem('notes')">＋ 新增</button>
      </div>
      <div class="list" id="list-notes"></div>
    </div>
    <div class="editor-panel" id="editor-notes">
      <div class="empty-state">
        <div class="icon">📝</div>
        <p>点击左侧笔记开始编辑，或新增笔记</p>
      </div>
    </div>
  </div>

</div>

<script>
// ─── Data model ───
const STORE_KEY = 'novel_project_v1';
let state = {
  title: '我的小说',
  synopsis: '',
  chapters: [],
  characters: [],
  worldbuilding: [],
  notes: [],
};
let activeTab = 'overview';
let activeItem = { chapters: null, characters: null, worldbuilding: null, notes: null };
let saveTimer = null;

// ─── Persistence ───
function load() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) state = JSON.parse(raw);
  } catch(e) {}
}
function save() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    localStorage.setItem(STORE_KEY, JSON.stringify(state));
  }, 400);
}

// ─── Tabs ───
document.querySelectorAll('.tab').forEach(t => {
  t.addEventListener('click', () => {
    const tab = t.dataset.tab;
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('visible'));
    document.getElementById('panel-' + tab).classList.add('visible');
    activeTab = tab;
    if (tab === 'overview') renderOverview();
  });
});

// ─── Project title ───
const titleInput = document.getElementById('project-title-input');
titleInput.addEventListener('input', () => { state.title = titleInput.value; save(); });

// ─── Synopsis ───
const synopsisEl = document.getElementById('synopsis');
synopsisEl.addEventListener('input', () => { state.synopsis = synopsisEl.value; save(); });

// ─── Helpers ───
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function countWords(text) {
  return text ? text.replace(/\s/g, '').length : 0;
}

// ─── List rendering ───
function renderList(section) {
  const listEl = document.getElementById('list-' + section);
  listEl.innerHTML = '';
  state[section].forEach((item, i) => {
    const div = document.createElement('div');
    div.className = 'list-item' + (activeItem[section] === item.id ? ' active' : '');
    div.innerHTML = `<span class="item-label">${item.title || '(无标题)'}</span>
      <button class="del-btn" title="删除" onclick="deleteItem('${section}','${item.id}',event)">✕</button>`;
    div.addEventListener('click', () => openItem(section, item.id));
    listEl.appendChild(div);
  });
}

// ─── Open / edit item ───
function openItem(section, id) {
  activeItem[section] = id;
  renderList(section);
  const item = state[section].find(x => x.id === id);
  if (!item) return;

  const panel = document.getElementById('editor-' + section);
  panel.innerHTML = `
    <div class="editor-toolbar">
      <input id="item-title-input" type="text" placeholder="标题…" value="${escHtml(item.title)}" maxlength="80" />
      <span class="word-count" id="wc">字数：${countWords(item.content)}</span>
    </div>
    <textarea id="editor" placeholder="在此输入内容…">${escHtml(item.content)}</textarea>
  `;

  const titleEl = panel.querySelector('#item-title-input');
  const contentEl = panel.querySelector('#editor');
  const wcEl = panel.querySelector('#wc');

  titleEl.addEventListener('input', () => {
    item.title = titleEl.value;
    item.updatedAt = Date.now();
    save();
    renderList(section);
  });
  contentEl.addEventListener('input', () => {
    item.content = contentEl.value;
    item.updatedAt = Date.now();
    wcEl.textContent = '字数：' + countWords(item.content);
    save();
  });
  contentEl.focus();
}

function escHtml(s) {
  return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ─── Add item ───
function addItem(section) {
  const labels = { chapters: '第X章', characters: '人物', worldbuilding: '设定', notes: '笔记' };
  const n = state[section].length + 1;
  const item = { id: uid(), title: labels[section].replace('X', n), content: '', createdAt: Date.now(), updatedAt: Date.now() };
  state[section].push(item);
  save();
  renderList(section);
  openItem(section, item.id);
}

// ─── Delete item ───
function deleteItem(section, id, e) {
  e.stopPropagation();
  if (!confirm('确认删除？此操作不可撤销。')) return;
  state[section] = state[section].filter(x => x.id !== id);
  if (activeItem[section] === id) {
    activeItem[section] = null;
    const panel = document.getElementById('editor-' + section);
    const icons = { chapters: '📖', characters: '👤', worldbuilding: '🌍', notes: '📝' };
    const hints = { chapters: '章节', characters: '人物', worldbuilding: '条目', notes: '笔记' };
    panel.innerHTML = `<div class="empty-state"><div class="icon">${icons[section]}</div><p>点击左侧${hints[section]}开始编辑，或新增${hints[section]}</p></div>`;
  }
  save();
  renderList(section);
}

// ─── Overview ───
function renderOverview() {
  const totalWords = ['chapters','characters','worldbuilding','notes']
    .reduce((s, k) => s + state[k].reduce((a, x) => a + countWords(x.content), 0), 0);
  const statsEl = document.getElementById('stats-grid');
  statsEl.innerHTML = `
    <div class="stat-card"><div class="num">${state.chapters.length}</div><div class="label">章节数</div></div>
    <div class="stat-card"><div class="num">${state.characters.length}</div><div class="label">人物档案</div></div>
    <div class="stat-card"><div class="num">${state.worldbuilding.length}</div><div class="label">世界观条目</div></div>
    <div class="stat-card"><div class="num">${totalWords.toLocaleString()}</div><div class="label">总字数</div></div>
  `;

  // Recent
  const all = [
    ...state.chapters.map(x => ({...x, _sec: '章节'})),
    ...state.characters.map(x => ({...x, _sec: '人物'})),
    ...state.worldbuilding.map(x => ({...x, _sec: '世界观'})),
    ...state.notes.map(x => ({...x, _sec: '笔记'})),
  ].sort((a,b) => (b.updatedAt||0) - (a.updatedAt||0)).slice(0, 5);

  const recentEl = document.getElementById('recent-list');
  if (all.length === 0) {
    recentEl.innerHTML = '<div style="color:var(--text-muted);font-size:0.88rem">暂无内容</div>';
  } else {
    recentEl.innerHTML = all.map(x => `
      <div class="recent-item">
        <div class="ri-title">[${x._sec}] ${escHtml(x.title||'无标题')}</div>
        <div class="ri-preview">${escHtml((x.content||'').slice(0,60))}…</div>
      </div>
    `).join('');
  }
}

// ─── Export ───
function exportProject() {
  let out = `# ${state.title}\n\n`;
  if (state.synopsis) out += `## 故事简介\n\n${state.synopsis}\n\n`;
  if (state.chapters.length) {
    out += `## 章节\n\n`;
    state.chapters.forEach(c => { out += `### ${c.title}\n\n${c.content}\n\n`; });
  }
  if (state.characters.length) {
    out += `## 人物\n\n`;
    state.characters.forEach(c => { out += `### ${c.title}\n\n${c.content}\n\n`; });
  }
  if (state.worldbuilding.length) {
    out += `## 世界观\n\n`;
    state.worldbuilding.forEach(c => { out += `### ${c.title}\n\n${c.content}\n\n`; });
  }
  if (state.notes.length) {
    out += `## 笔记\n\n`;
    state.notes.forEach(c => { out += `### ${c.title}\n\n${c.content}\n\n`; });
  }
  const blob = new Blob([out], { type: 'text/markdown;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (state.title || '小说项目') + '.md';
  a.click();
}

// ─── Clear ───
function clearAll() {
  if (!confirm('确认清空整个项目？所有数据将被删除，此操作不可撤销。')) return;
  state = { title: '我的小说', synopsis: '', chapters: [], characters: [], worldbuilding: [], notes: [] };
  localStorage.removeItem(STORE_KEY);
  init();
}

// ─── Init ───
function init() {
  load();
  titleInput.value = state.title;
  synopsisEl.value = state.synopsis;
  ['chapters','characters','worldbuilding','notes'].forEach(s => {
    activeItem[s] = null;
    renderList(s);
  });
  renderOverview();
}

init();
</script>
</body>
</html>
